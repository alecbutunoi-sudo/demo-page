<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        /* Base Page Layout */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        /* Title Heading */
        h1 {
            color: #2c3e50;
            text-align: center;
        }

        /* White Cards for Content */
        p {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Links */
        a {
            color: #2980b9;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Featured Image Styling */
        .featured-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 20px auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Big Cursive Signature */
        .made-by-cursive {
            font-family: 'Brush Script MT', 'Pacifico', cursive;
            font-size: 3.5rem;
            color: #2c3e50;
            text-align: center;
            margin: 30px 0 10px 0;
        }

        footer {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Intro to Web Development</h1>
