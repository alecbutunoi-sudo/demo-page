<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Webpage</title>
    <style>
        /* Styles applied to the entire page body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        /* Styles applied to main headings */
        h1 {
            color: #2c3e50;
            text-align: center;
        }

        /* Styles applied to content cards */
        p {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Styles applied to links */
        a {
            color: #2980b9;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Styles applied to the featured image */
        .featured-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 20px auto;
        }

        /* Styles applied to the page footer credit */
        footer {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1>Intro to Web Development</h1>

    <img src="welcome-banner.jpg" alt="A colorful desk setup with a laptop and coffee cup" class="featured-image">

    <p>Welcome to our class! In this course, we are learning the basics of coding and publishing our very first websites using HTML and GitHub Pages.</p>

    <p>
        Check out my favorite website: 
        <a href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer">Visit Wikipedia</a>
    </p>

    <footer>Created by Alec</footer>

</body>
</html>
